<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">vLLM Greedy Sampling 流程</title>
  <desc id="desc">SamplingParams 先检查 0 &lt; temperature &lt; _MAX_TEMP，并 clamp to 0.01；_verify_args 拒绝负温度后，才通过 temperature 与 _SAMPLING_EPS 选择 GREEDY、RANDOM_SEED 或 RANDOM。Batch metadata 再根据 all_greedy、all_random 或 mixed batch 选择 argmax、top-k / top-p 随机采样，或以 temperature mask 通过 torch.where 合并 greedy_sampled 与 random_sampled。</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#8e5f68" />
    </marker>
    <style>
      .node { fill: #f7f7f6; stroke: #b98991; stroke-width: 2; }
      .accent { fill: #f4e8ea; stroke: #b98991; stroke-width: 2; }
      .paper { fill: #fff; stroke: #b98991; stroke-width: 2; }
      .edge { fill: none; stroke: #8e5f68; stroke-width: 2; marker-end: url(#arrow); }
      .label { fill: #3f3638; font: 600 16px Inter, "Noto Sans SC", sans-serif; text-anchor: middle; }
      .small { fill: #675b5e; font: 13px Inter, "Noto Sans SC", sans-serif; text-anchor: middle; }
      .edge-label { fill: #8e5f68; font: 600 12px Inter, sans-serif; }
      .lane { fill: #8e5f68; font: 700 13px Inter, sans-serif; letter-spacing: 1px; }
    </style>
  </defs>
  <rect width="1200" height="700" fill="#fff" />

  <text x="35" y="24" class="lane">PARAMETER NORMALIZATION</text>
  <rect x="35" y="44" width="170" height="58" rx="15" class="node" />
  <text x="120" y="68" class="label">SamplingParams</text>
  <text x="120" y="88" class="small">raw temperature / seed</text>

  <path d="M245 28 L350 73 L245 118 L140 73 Z" class="accent" transform="translate(105 0)" />
  <text x="350" y="67" class="label">0 &lt; temperature &lt;</text>
  <text x="350" y="88" class="small">_MAX_TEMP ?</text>

  <rect x="505" y="17" width="180" height="58" rx="15" class="accent" />
  <text x="595" y="42" class="label">clamp to 0.01</text>
  <text x="595" y="62" class="small">temperature = _MAX_TEMP</text>

  <rect x="505" y="101" width="180" height="58" rx="15" class="node" />
  <text x="595" y="126" class="label">_verify_args</text>
  <text x="595" y="146" class="small">temperature &lt; 0 → error</text>

  <path d="M800 85 L900 126 L800 167 L700 126 Z" class="accent" />
  <text x="800" y="120" class="label">temperature &lt;</text>
  <text x="800" y="141" class="small">_SAMPLING_EPS ?</text>

  <rect x="965" y="66" width="200" height="58" rx="15" class="accent" />
  <text x="1065" y="91" class="label">GREEDY</text>
  <text x="1065" y="111" class="small">normalize top-k / top-p</text>

  <path d="M800 178 L890 212 L800 246 L710 212 Z" class="node" />
  <text x="800" y="218" class="label">seed is set ?</text>
  <rect x="965" y="153" width="200" height="44" rx="13" class="node" />
  <text x="1065" y="181" class="label">RANDOM_SEED</text>
  <rect x="965" y="216" width="200" height="44" rx="13" class="node" />
  <text x="1065" y="244" class="label">RANDOM</text>

  <path d="M205 73 H245" class="edge" />
  <path d="M455 61 H505" class="edge" />
  <text x="472" y="52" class="edge-label">yes</text>
  <path d="M350 118 V130 H505" class="edge" />
  <text x="418" y="123" class="edge-label">no</text>
  <path d="M595 75 V101" class="edge" />
  <path d="M685 130 H700" class="edge" />
  <path d="M900 112 H965" class="edge" />
  <text x="903" y="102" class="edge-label">yes</text>
  <path d="M800 167 V178" class="edge" />
  <text x="810" y="176" class="edge-label">no</text>
  <path d="M890 202 H930 V175 H965" class="edge" />
  <text x="906" y="190" class="edge-label">yes</text>
  <path d="M890 222 H930 V238 H965" class="edge" />
  <text x="906" y="236" class="edge-label">no</text>

  <rect x="475" y="270" width="250" height="58" rx="16" class="paper" />
  <text x="600" y="294" class="label">Batch metadata</text>
  <text x="600" y="315" class="small">all_greedy / all_random</text>
  <path d="M1065 124 V258 H640 V270" class="edge" />
  <path d="M1065 197 V250 H610 V270" class="edge" />
  <path d="M1065 260 H580 V270" class="edge" />

  <line x1="35" y1="350" x2="1165" y2="350" stroke="#e8dddf" stroke-width="2" />
  <text x="35" y="373" class="lane">BATCH EXECUTION</text>

  <rect x="60" y="390" width="210" height="50" rx="14" class="accent" />
  <text x="165" y="421" class="label">all_greedy</text>
  <rect x="490" y="390" width="220" height="50" rx="14" class="node" />
  <text x="600" y="421" class="label">all_random</text>
  <rect x="920" y="390" width="220" height="50" rx="14" class="node" />
  <text x="1030" y="421" class="label">mixed batch</text>
  <path d="M600 328 V365 H165 V390" class="edge" />
  <path d="M600 328 V390" class="edge" />
  <path d="M600 365 H1030 V390" class="edge" />

  <rect x="60" y="480" width="210" height="52" rx="14" class="paper" />
  <text x="165" y="512" class="label">argmax</text>
  <path d="M165 440 V480" class="edge" />

  <rect x="480" y="468" width="240" height="82" rx="14" class="paper" />
  <text x="600" y="491" class="small">temperature → processors</text>
  <text x="600" y="516" class="label">top-k / top-p</text>
  <text x="600" y="538" class="small">random_sampled</text>
  <path d="M600 440 V468" class="edge" />

  <rect x="790" y="472" width="170" height="66" rx="14" class="paper" />
  <text x="875" y="497" class="small">greedy_sampled</text>
  <text x="875" y="520" class="label">argmax</text>
  <rect x="1000" y="462" width="175" height="86" rx="14" class="paper" />
  <text x="1088" y="486" class="small">safe temperature</text>
  <text x="1088" y="510" class="label">top-k / top-p</text>
  <text x="1088" y="534" class="small">random_sampled</text>
  <path d="M1030 440 V454 H875 V472" class="edge" />
  <path d="M1030 440 V462" class="edge" />

  <rect x="900" y="590" width="210" height="58" rx="15" class="accent" />
  <text x="1005" y="614" class="label">torch.where</text>
  <text x="1005" y="635" class="small">temperature mask</text>
  <path d="M875 538 V566 H960 V590" class="edge" />
  <path d="M1088 548 V566 H1050 V590" class="edge" />

  <rect x="490" y="628" width="220" height="50" rx="15" fill="#f7f7f6" stroke="#8e5f68" stroke-width="2" />
  <text x="600" y="659" class="label">sampled token ids</text>
  <path d="M165 532 V653 H490" class="edge" />
  <path d="M600 550 V628" class="edge" />
  <path d="M900 619 H760 V653 H710" class="edge" />
</svg>
