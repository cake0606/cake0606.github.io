<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">vLLM Greedy Sampling 流程</title>
  <desc id="desc">SamplingParams 根据 temperature 与 _SAMPLING_EPS 选择 GREEDY 或随机采样。Batch metadata 再根据 all_greedy、all_random 或 mixed batch 选择 argmax、top-k / top-p 随机采样，或通过 torch.where 合并结果。</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#8e5f68" />
    </marker>
    <style>
      .node { fill: #f7f7f6; stroke: #b98991; stroke-width: 2; }
      .accent { fill: #f4e8ea; stroke: #b98991; stroke-width: 2; }
      .paper { fill: #fff; stroke: #b98991; stroke-width: 2; }
      .edge { fill: none; stroke: #8e5f68; stroke-width: 2; marker-end: url(#arrow); }
      .label { fill: #3f3638; font: 600 17px Inter, "Noto Sans SC", sans-serif; text-anchor: middle; }
      .small { fill: #675b5e; font: 14px Inter, "Noto Sans SC", sans-serif; text-anchor: middle; }
      .edge-label { fill: #8e5f68; font: 600 13px Inter, sans-serif; }
      .lane { fill: #8e5f68; font: 700 13px Inter, sans-serif; letter-spacing: 1px; text-transform: uppercase; }
    </style>
  </defs>
  <rect width="1200" height="700" fill="#fff" />

  <text x="50" y="28" class="lane">PARAMETER ROUTING</text>
  <rect x="50" y="48" width="190" height="62" rx="16" class="node" />
  <text x="145" y="75" class="label">SamplingParams</text>
  <text x="145" y="96" class="small">temperature / seed</text>

  <path d="M365 45 L475 79 L365 113 L255 79 Z" class="accent" />
  <text x="365" y="73" class="label">temperature &lt;</text>
  <text x="365" y="95" class="small">_SAMPLING_EPS ?</text>

  <rect x="555" y="31" width="215" height="62" rx="16" class="accent" />
  <text x="662" y="58" class="label">GREEDY</text>
  <text x="662" y="79" class="small">normalize top-k / top-p</text>

  <path d="M662 116 L765 151 L662 186 L559 151 Z" class="node" />
  <text x="662" y="157" class="label">seed is set ?</text>

  <rect x="860" y="102" width="180" height="48" rx="14" class="node" />
  <text x="950" y="132" class="label">RANDOM_SEED</text>
  <rect x="860" y="165" width="180" height="48" rx="14" class="node" />
  <text x="950" y="195" class="label">RANDOM</text>

  <path d="M240 79 H255" class="edge" />
  <path d="M475 79 H555" class="edge" />
  <text x="508" y="68" class="edge-label">yes</text>
  <path d="M365 113 V151 H559" class="edge" />
  <text x="420" y="143" class="edge-label">no</text>
  <path d="M765 141 H820 V126 H860" class="edge" />
  <text x="797" y="130" class="edge-label">yes</text>
  <path d="M765 161 H820 V189 H860" class="edge" />
  <text x="797" y="181" class="edge-label">no</text>

  <rect x="470" y="236" width="260" height="66" rx="17" class="paper" />
  <text x="600" y="264" class="label">Batch metadata</text>
  <text x="600" y="286" class="small">all_greedy / all_random</text>
  <path d="M662 93 V220 H600 V236" class="edge" />
  <path d="M950 150 V218 H640 V236" class="edge" />
  <path d="M950 213 V225 H680 V236" class="edge" />

  <line x1="50" y1="330" x2="1150" y2="330" stroke="#e8dddf" stroke-width="2" />
  <text x="50" y="356" class="lane">BATCH EXECUTION</text>

  <rect x="70" y="380" width="220" height="54" rx="15" class="accent" />
  <text x="180" y="413" class="label">all_greedy</text>
  <rect x="490" y="380" width="220" height="54" rx="15" class="node" />
  <text x="600" y="413" class="label">all_random</text>
  <rect x="910" y="380" width="220" height="54" rx="15" class="node" />
  <text x="1020" y="413" class="label">mixed batch</text>

  <path d="M600 302 V342 H180 V380" class="edge" />
  <path d="M600 302 V380" class="edge" />
  <path d="M600 342 H1020 V380" class="edge" />

  <rect x="70" y="482" width="220" height="58" rx="15" class="paper" />
  <text x="180" y="517" class="label">argmax</text>

  <rect x="485" y="465" width="230" height="92" rx="15" class="paper" />
  <text x="600" y="490" class="small">temperature → processors</text>
  <text x="600" y="516" class="label">top-k / top-p</text>
  <text x="600" y="541" class="small">random sample</text>

  <rect x="895" y="460" width="250" height="102" rx="15" class="paper" />
  <text x="1020" y="485" class="small">argmax + safe temperature</text>
  <text x="1020" y="512" class="label">top-k / top-p</text>
  <text x="1020" y="538" class="small">random sample</text>

  <path d="M180 434 V482" class="edge" />
  <path d="M600 434 V465" class="edge" />
  <path d="M1020 434 V460" class="edge" />

  <rect x="925" y="595" width="190" height="54" rx="15" class="accent" />
  <text x="1020" y="628" class="label">torch.where</text>
  <path d="M1020 562 V595" class="edge" />

  <rect x="485" y="625" width="230" height="56" rx="16" fill="#f7f7f6" stroke="#8e5f68" stroke-width="2" />
  <text x="600" y="660" class="label">sampled token ids</text>
  <path d="M180 540 V653 H485" class="edge" />
  <path d="M600 557 V625" class="edge" />
  <path d="M925 622 H760 V653 H715" class="edge" />
</svg>
