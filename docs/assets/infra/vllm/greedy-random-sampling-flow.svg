<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">vLLM Greedy 与 Random Sampling 流程</title>
  <desc id="desc">Greedy 与 Random Sampling 的统一流程：SamplingParams 先检查 0 &lt; temperature &lt; _MAX_TEMP，并 clamp to 0.01；_verify_args 拒绝负温度后，才通过 temperature 与 _SAMPLING_EPS 选择 GREEDY、RANDOM_SEED 或 RANDOM。Batch metadata 再根据 all_greedy、all_random 或 mixed batch 选择 argmax、top-k / top-p 随机采样，或以 temperature mask 通过 torch.where 合并 greedy_sampled 与 random_sampled。</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#8e5f68" />
    </marker>
    <style>
      .node { fill: #f7f7f6; stroke: #b98991; stroke-width: 2; }
      .accent { fill: #f4e8ea; stroke: #b98991; stroke-width: 2; }
      .paper { fill: #fff; stroke: #b98991; stroke-width: 2; }
      .edge { fill: none; stroke: #8e5f68; stroke-width: 2; marker-end: url(#arrow); }
      .label { fill: #3f3638; font: 600 16px Inter, "Noto Sans SC", sans-serif; text-anchor: middle; }
      .small { fill: #675b5e; font: 13px Inter, "Noto Sans SC", sans-serif; text-anchor: middle; }
      .edge-label { fill: #8e5f68; font: 600 12px Inter, sans-serif; }
      .lane { fill: #8e5f68; font: 700 13px Inter, sans-serif; letter-spacing: 1px; }
    </style>
  </defs>
  <rect width="1200" height="700" fill="#fff" />

  <text x="35" y="24" class="lane">PARAMETER NORMALIZATION</text>
  <rect data-node="params" x="35" y="55" width="160" height="56" rx="15" class="node" />
  <text x="115" y="79" class="label">SamplingParams</text>
  <text x="115" y="99" class="small">raw temperature / seed</text>

  <polygon data-node="clamp-check" points="330,38 425,83 330,128 235,83" class="accent" />
  <text x="330" y="77" class="label">0 &lt; temperature &lt;</text>
  <text x="330" y="98" class="small">_MAX_TEMP ?</text>

  <rect data-node="clamp" x="495" y="16" width="175" height="56" rx="15" class="accent" />
  <text x="582.5" y="39" class="label">clamp to 0.01</text>
  <text x="582.5" y="59" class="small">temperature = _MAX_TEMP</text>

  <rect data-node="verify" x="495" y="122" width="175" height="56" rx="15" class="node" />
  <text x="582.5" y="145" class="label">_verify_args</text>
  <text x="582.5" y="165" class="small">temperature &lt; 0 → error</text>

  <polygon data-node="eps" points="805,108 900,150 805,192 710,150" class="accent" />
  <text x="805" y="144" class="label">temperature &lt;</text>
  <text x="805" y="165" class="small">_SAMPLING_EPS ?</text>

  <rect data-node="greedy" x="950" y="76" width="200" height="56" rx="15" class="accent" />
  <text x="1050" y="99" class="label">GREEDY</text>
  <text x="1050" y="119" class="small">normalize top-k / top-p</text>

  <polygon data-node="seed" points="805,228 895,262 805,296 715,262" class="node" />
  <text x="805" y="268" class="label">seed is set ?</text>

  <rect data-node="random-seed" x="965" y="202" width="190" height="44" rx="13" class="node" />
  <text x="1060" y="229" class="label">RANDOM_SEED</text>
  <rect data-node="random" x="965" y="266" width="190" height="44" rx="13" class="node" />
  <text x="1060" y="293" class="label">RANDOM</text>

  <path d="M195 83 H235" class="edge" data-edge="e1" data-source="params" data-target="clamp-check" />
  <path d="M425 83 H445 V44 H495" class="edge" data-edge="e2" data-source="clamp-check" data-target="clamp" />
  <text x="459" y="36" class="edge-label">yes</text>
  <path d="M330 128 V150 H495" class="edge" data-edge="e3" data-source="clamp-check" data-target="verify" />
  <text x="405" y="143" class="edge-label">no</text>
  <path d="M582.5 72 V122" class="edge" data-edge="e4" data-source="clamp" data-target="verify" />
  <path d="M670 150 H710" class="edge" data-edge="e5" data-source="verify" data-target="eps" />
  <path d="M900 150 H910 V104 H950" class="edge" data-edge="e6" data-source="eps" data-target="greedy" />
  <text x="916" y="96" class="edge-label">yes</text>
  <path d="M805 192 V228" class="edge" data-edge="e7" data-source="eps" data-target="seed" />
  <text x="815" y="215" class="edge-label">no</text>
  <path d="M850 245 H925 V224 H965" class="edge" data-edge="e8" data-source="seed" data-target="random-seed" />
  <text x="935" y="216" class="edge-label">yes</text>
  <path d="M850 279 H925 V288 H965" class="edge" data-edge="e9" data-source="seed" data-target="random" />
  <text x="935" y="281" class="edge-label">no</text>

  <rect data-node="metadata" x="475" y="315" width="250" height="58" rx="16" class="paper" />
  <text x="600" y="340" class="label">Batch metadata</text>
  <text x="600" y="361" class="small">all_greedy / all_random</text>
  <path d="M1150 104 H1195 V362 H725" class="edge" data-edge="e10" data-source="greedy" data-target="metadata" />
  <path d="M1155 224 H1185 V344 H725" class="edge" data-edge="e11" data-source="random-seed" data-target="metadata" />
  <path d="M1155 288 H1175 V326 H725" class="edge" data-edge="e12" data-source="random" data-target="metadata" />

  <line x1="35" y1="395" x2="1165" y2="395" stroke="#e8dddf" stroke-width="2" />
  <text x="35" y="418" class="lane">BATCH EXECUTION</text>

  <rect data-node="all-greedy" x="60" y="430" width="210" height="50" rx="14" class="accent" />
  <text x="165" y="461" class="label">all_greedy</text>
  <rect data-node="all-random" x="490" y="430" width="220" height="50" rx="14" class="node" />
  <text x="600" y="461" class="label">all_random</text>
  <rect data-node="mixed" x="920" y="430" width="220" height="50" rx="14" class="node" />
  <text x="1030" y="461" class="label">mixed batch</text>
  <path d="M520 373 V410 H306 V455 H270" class="edge" data-edge="e13" data-source="metadata" data-target="all-greedy" />
  <path d="M600 373 V430" class="edge" data-edge="e14" data-source="metadata" data-target="all-random" />
  <path d="M680 373 V394 H1030 V430" class="edge" data-edge="e15" data-source="metadata" data-target="mixed" />

  <rect data-node="argmax" x="60" y="520" width="210" height="52" rx="14" class="paper" />
  <text x="165" y="552" class="label">argmax</text>
  <path d="M165 480 V520" class="edge" data-edge="e16" data-source="all-greedy" data-target="argmax" />

  <rect data-node="random-pipeline" x="480" y="520" width="240" height="82" rx="14" class="paper" />
  <text x="600" y="544" class="small">temperature → processors</text>
  <text x="600" y="569" class="label">top-k / top-p</text>
  <text x="600" y="590" class="small">random_sampled</text>
  <path d="M600 480 V520" class="edge" data-edge="e17" data-source="all-random" data-target="random-pipeline" />

  <rect data-node="mixed-greedy" x="760" y="525" width="180" height="66" rx="14" class="paper" />
  <text x="850" y="550" class="small">greedy_sampled</text>
  <text x="850" y="575" class="label">argmax</text>
  <rect data-node="mixed-random" x="1000" y="520" width="175" height="86" rx="14" class="paper" />
  <text x="1088" y="544" class="small">safe temperature</text>
  <text x="1088" y="568" class="label">top-k / top-p</text>
  <text x="1088" y="592" class="small">random_sampled</text>
  <path d="M970 480 V485 H850 V525" class="edge" data-edge="e18" data-source="mixed" data-target="mixed-greedy" />
  <path d="M1090 480 V520" class="edge" data-edge="e19" data-source="mixed" data-target="mixed-random" />

  <rect data-node="where" x="900" y="640" width="210" height="50" rx="15" class="accent" />
  <text x="1005" y="661" class="label">torch.where</text>
  <text x="1005" y="681" class="small">temperature mask</text>
  <path d="M850 591 V660 H900" class="edge" data-edge="e20" data-source="mixed-greedy" data-target="where" />
  <path d="M1088 606 H1165 V670 H1110" class="edge" data-edge="e21" data-source="mixed-random" data-target="where" />

  <rect data-node="output" x="490" y="645" width="220" height="45" rx="15" class="node" />
  <text x="600" y="673" class="label">sampled token ids</text>
  <path d="M165 572 V667 H490" class="edge" data-edge="e22" data-source="argmax" data-target="output" />
  <path d="M600 602 V645" class="edge" data-edge="e23" data-source="random-pipeline" data-target="output" />
  <path d="M900 675 H760 V667 H710" class="edge" data-edge="e24" data-source="where" data-target="output" />
</svg>
