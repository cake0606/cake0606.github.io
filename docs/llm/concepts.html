<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="RL concepts note with table of contents, math rendering, and readable code formatting."
  >
  <title>RL Concepts | Note Viewer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap"
    rel="stylesheet"
  >
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css"
  >
  <link rel="stylesheet" href="../style.css?v=20260810-2">
  <link rel="stylesheet" href="../note.css?v=20260810-2">
  <link rel="stylesheet" href="../vendor/catppuccin-mocha.css?v=20260810-2">
</head>
<body data-note-path="llm/concepts/concepts.md">
  <a class="skip-link" href="#note-content">Skip to note content</a>

  <header class="site-header note-header">
    <div class="container nav-shell note-nav-shell">
      <a class="brand" href="../index.html" aria-label="Go to homepage">
        <span class="brand-mark">JZ</span>
        <span class="brand-text">
          <strong>Technical Notes</strong>
          <span>Note Viewer</span>
        </span>
      </a>

      <a class="nav-home" href="../index.html">Home</a>

      <div class="note-header-actions">
        <button
          class="panel-toggle notes-toggle"
          type="button"
          aria-expanded="false"
          aria-controls="notes-sidebar"
          aria-label="Toggle note navigation"
        >
          Notes
        </button>

        <button
          class="panel-toggle toc-toggle"
          type="button"
          aria-expanded="false"
          aria-controls="toc-sidebar"
          aria-label="Toggle table of contents"
        >
          Contents
        </button>
      </div>

    </div>
  </header>

  <main class="note-page">
    <div class="container note-layout">
      <aside class="notes-sidebar" id="notes-sidebar" aria-label="Note navigation">
        <div class="surface-card sidebar-card notes-card">
          <p class="eyebrow">Notes</p>
          <h2 class="sidebar-title sidebar-section-title">Reinforcement Learning</h2>
          <nav class="notes-nav" id="notes-nav">
            <p class="toc-empty">The note list will appear here.</p>
          </nav>
        </div>
      </aside>

      <section class="note-main">
        <article class="surface-card note-article">
          <header class="note-meta">
            <p class="eyebrow">Technical Note</p>
            <h2 id="note-heading">Loading markdown...</h2>
          </header>
          <div class="note-content" id="note-content" aria-live="polite"></div>
        </article>
      </section>

      <aside class="toc-sidebar" id="toc-sidebar" aria-label="Table of contents">
        <div class="surface-card sidebar-card toc-card">
          <p class="eyebrow">Contents</p>
          <h2 class="sidebar-title" id="note-title">Loading note...</h2>
          <p class="sidebar-path" id="note-path"></p>
          <nav class="toc-nav" id="toc-nav">
            <p class="toc-empty">The table of contents will appear here.</p>
          </nav>
        </div>
      </aside>
    </div>
  </main>

  <script id="embedded-markdown" type="text/plain">

  </script>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/highlight.min.js"></script>
  <script src="../note-paths.js?v=20260810-2"></script>
  <script src="../code-rendering.js?v=20260810-2"></script>
  <script src="../note.js?v=20260810-2"></script>
</body>
</html>
